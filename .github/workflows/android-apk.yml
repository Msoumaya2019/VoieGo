name: APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configurer Firebase Android
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG" ]; then
            echo "Le secret FIREBASE_ANDROID_CONFIG est absent."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG" > android/app/google-services.json

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze

      - name: Lancer les tests
        run: flutter test

      - name: Compiler l’APK Android de test
        run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=VOIEGO_API_BASE_URL=${{ vars.VOIEGO_API_BASE_URL }}

      - name: Publier l’APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: VoieGo-Android-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
