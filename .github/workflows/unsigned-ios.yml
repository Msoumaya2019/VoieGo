name: IPA iOS non signé

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze

      - name: Lancer les tests
        run: flutter test

      - name: Compiler l’app iOS sans signature
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=VOIEGO_API_BASE_URL=${{ vars.VOIEGO_API_BASE_URL }}

      - name: Créer l’archive IPA non signée
        run: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          ditto -c -k --sequesterRsrc Payload VoieGo-unsigned.ipa

      - name: Publier l’IPA comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: VoieGo-unsigned-${{ github.ref_name }}
          path: build/ios/unsigned/VoieGo-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
